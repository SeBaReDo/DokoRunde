<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #ddd; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 14px; left: 14px;
    background: rgba(0,0,0,0.65);
    border: 1px solid #2a2a3a;
    padding: 8px 16px; border-radius: 6px;
    font-size: 11px; letter-spacing: 1.5px; color: #8a9e8f;
  }
  #hud .nums { color: #c9a84c; font: bold 20px monospace; margin-top: 4px; letter-spacing: 8px; }

  #interact-hint {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); border: 1px solid #444;
    padding: 8px 22px; border-radius: 6px;
    font-size: 13px; display: none;
  }
  #interact-hint span { color: #c9a84c; font-weight: bold; }

  #controls-hint {
    position: fixed; bottom: 14px; right: 14px;
    color: #444; font-size: 11px; text-align: right; line-height: 2;
  }

  /* Dialog */
  #dialog {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.78);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #dialog.show { display: flex; }
  .dbox {
    background: #12121e; border: 2px solid #c9a84c; border-radius: 10px;
    padding: 38px 52px; max-width: 520px; width: 90%; text-align: center;
  }
  .dbox h2 { color: #c9a84c; font-size: 17px; letter-spacing: 2px; margin-bottom: 16px; }
  .dbox p  { line-height: 1.8; font-size: 15px; white-space: pre-wrap; }
  .dbox .sub { color: #555; font-size: 12px; margin-top: 22px; letter-spacing: 1px; }

  #code-display {
    background: #0d0d0d; border: 2px solid #c9a84c; border-radius: 6px;
    padding: 14px 28px; margin: 22px auto 0; width: fit-content;
    font: bold 40px monospace; color: #c9a84c; letter-spacing: 14px;
  }
  #code-err { color: #e84a4a; font-size: 13px; min-height: 22px; margin-top: 10px; }

  /* Case reveal */
  #reveal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 20;
  }
  #reveal.show { display: flex; }
  #tree-canvas {
    border: 4px solid #c9a84c; border-radius: 4px;
    box-shadow: 0 0 40px rgba(201,168,76,0.4);
    margin-bottom: 22px;
  }
  #reveal p { font-size: 16px; color: #ddd8cc; }
  #reveal .r-sub { color: #555; font-size: 12px; margin-top: 14px; letter-spacing: 1px; }
</style>
</head>

<script type="module">
import * as THREE from 'three';

// ── Renderer ─────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Scene & Camera ───────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a3a4a);
scene.fog = new THREE.Fog(0x3a3a4a, 18, 35);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 80);

// ── Lighting ─────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xfff8f0, 2.2));

const ceilLight = new THREE.PointLight(0xfff5e0, 5, 28);
ceilLight.position.set(0, 3.8, 0);
ceilLight.castShadow = true;
ceilLight.shadow.mapSize.setScalar(1024);
scene.add(ceilLight);

// Extra fill lights so corners stay bright
const fillA = new THREE.PointLight(0xfff0dd, 2, 20);
fillA.position.set(-6, 3.5, -6);
scene.add(fillA);
const fillB = new THREE.PointLight(0xfff0dd, 2, 20);
fillB.position.set(6, 3.5, 6);
scene.add(fillB);

// ── Wall candles ──────────────────────────────────────────────
const candleLights = [];

function makeCandle(x, y, z) {
  const g = new THREE.Group();

  // Wax body
  const wax = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.07, 0.28, 8),
    new THREE.MeshStandardMaterial({ color: 0xf0e8d0, roughness: 0.9 })
  );
  wax.position.y = 0.14;
  wax.castShadow = true;
  g.add(wax);

  // Flame (small glowing sphere)
  const flame = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 6, 6),
    new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff6600, emissiveIntensity: 2, roughness: 1 })
  );
  flame.position.y = 0.34;
  g.add(flame);
  g._flame = flame;

  // Wall sconce bracket (small box)
  const bracket = new THREE.Mesh(
    new THREE.BoxGeometry(0.18, 0.06, 0.18),
    new THREE.MeshStandardMaterial({ color: 0x4a3820, roughness: 0.8 })
  );
  bracket.position.y = 0.03;
  g.add(bracket);

  // Point light
  const light = new THREE.PointLight(0xff9933, 1.8, 6);
  light.position.y = 0.4;
  g.add(light);
  candleLights.push({ light, flame: g._flame });

  g.position.set(x, y, z);
  scene.add(g);
  return g;
}

// Candles — both rooms
makeCandle(-9.5, 2.0, -9);
makeCandle( 9.5, 2.0, -9);
makeCandle(-9.5, 2.0, -3);
makeCandle( 9.5, 2.0, -3);
makeCandle(-9.5, 2.0,  5);
makeCandle( 9.5, 2.0,  5);
makeCandle(-9.5, 2.0, 10);
makeCandle( 9.5, 2.0, 10);
makeCandle( 0,   2.0,-11.5);
makeCandle( 0,   2.0, 11.5);

// ── Helpers ───────────────────────────────────────────────────
function mesh(geo, mat, x=0, y=0, z=0, ry=0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

// ── Room ─────────────────────────────────────────────────────
// Layout: Room1 (entry) z[-12,0], Room2 (back) z[0,12], both x[-10,10]
// Middle wall at z=0 with door gap x[-2,2], height 2.6

const floorMat = new THREE.MeshStandardMaterial({ color: 0x8b5e3c, roughness: 0.88 });
const wallMat  = new THREE.MeshStandardMaterial({ color: 0xa8a8b0, roughness: 0.9  });
const ceilMat  = new THREE.MeshStandardMaterial({ color: 0xcccccc });
const skirtMat = new THREE.MeshStandardMaterial({ color: 0x6a4a28 });
const frameMat = new THREE.MeshStandardMaterial({ color: 0x7a5a38, roughness: 0.8  });

// Floor & ceiling spanning both rooms
mesh(new THREE.PlaneGeometry(20,24), floorMat, 0, 0,  0, -Math.PI/2);
mesh(new THREE.PlaneGeometry(20,24), ceilMat,  0, 4,  0,  Math.PI/2);

const wallMeshes = [];
function addWall(geo, x, y, z, ry=0) {
  const m = new THREE.Mesh(geo, wallMat);
  m.position.set(x,y,z); m.rotation.y=ry;
  m.castShadow=true; m.receiveShadow=true;
  scene.add(m); wallMeshes.push(m); return m;
}

// Outer walls
addWall(new THREE.BoxGeometry(20, 4, 0.3),  0, 2,-12);   // back room1
addWall(new THREE.BoxGeometry(20, 4, 0.3),  0, 2, 12);   // back room2
addWall(new THREE.BoxGeometry(0.3, 4, 24),-10, 2,  0);   // left
addWall(new THREE.BoxGeometry(0.3, 4, 24), 10, 2,  0);   // right

// Middle wall — two segments with door gap (x[-2,2])
addWall(new THREE.BoxGeometry(8, 4, 0.3), -6, 2, 0);     // left segment  (x-10 to -2)
addWall(new THREE.BoxGeometry(8, 4, 0.3),  6, 2, 0);     // right segment (x2 to 10)
// Lintel above door
mesh(new THREE.BoxGeometry(4, 1.4, 0.3), wallMat, 0, 3.3, 0);

// Door frame
mesh(new THREE.BoxGeometry(0.22, 2.65, 0.35), frameMat, -2,  1.32, 0);
mesh(new THREE.BoxGeometry(0.22, 2.65, 0.35), frameMat,  2,  1.32, 0);
mesh(new THREE.BoxGeometry(4.44, 0.22, 0.35), frameMat,  0,  2.71, 0);

// Open door (hinged at x=-2, swung 90° into room2)
const doorMat = new THREE.MeshStandardMaterial({ color: 0x6a4828, roughness: 0.75 });
const doorG = new THREE.Group();
doorG.position.set(-2, 0, 0);
const doorPanel = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.55, 3.9), doorMat);
doorPanel.position.set(0.04, 1.27, 1.95);
doorPanel.castShadow = true; doorPanel.receiveShadow = true;
doorG.add(doorPanel);
// door trim
for (const [dy,dz] of [[0.6,0.6],[0.6,-0.6],[1.9,0.6],[1.9,-0.6]]) {
  const trim = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.8,1.6), new THREE.MeshStandardMaterial({color:0x7a5838,roughness:0.8}));
  trim.position.set(0.05, dy, dz); doorG.add(trim);
}
// door knob
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8), new THREE.MeshStandardMaterial({color:0xc9a84c,metalness:0.9,roughness:0.2}));
knob.position.set(0.12,1.27,0.3); doorG.add(knob);
scene.add(doorG);

// Skirting boards
mesh(new THREE.BoxGeometry(20,0.14,0.07), skirtMat,  0, 0.07,-11.9);
mesh(new THREE.BoxGeometry(20,0.14,0.07), skirtMat,  0, 0.07, 11.9);
mesh(new THREE.BoxGeometry(0.07,0.14,24),skirtMat, -9.9,0.07,  0);
mesh(new THREE.BoxGeometry(0.07,0.14,24),skirtMat,  9.9,0.07,  0);

// Desk helper
function makeDesk(x, z, ry=0) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.7 });
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(3.2,0.08,1.3), mat);
  top.position.y=0.82; top.castShadow=true; top.receiveShadow=true; g.add(top);
  for (const [lx,lz] of [[-1.5,-0.55],[1.5,-0.55],[-1.5,0.55],[1.5,0.55]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.82,0.08),mat);
    leg.position.set(lx,0.41,lz); leg.castShadow=true; g.add(leg);
  }
  g.position.set(x,0,z); g.rotation.y=ry; scene.add(g);
}
function makeShelf(x, z, ry=0) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x3a2a18, roughness: 0.8 });
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.4,2.2,1.3),mat);
  body.position.y=1.1; body.castShadow=true; body.receiveShadow=true; g.add(body);
  for (const h of [0.4,0.95,1.5]) {
    const s=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.04,1.35),mat); s.position.y=h; g.add(s);
  }
  g.position.set(x,0,z); g.rotation.y=ry; scene.add(g);
}

// Room 1 furniture
makeDesk(-6, -8);
makeShelf(-9.7, -6, Math.PI/2);
makeShelf( 9.7, -5, -Math.PI/2);
// Room 2 furniture
makeDesk(5, 7, 0.2);
makeShelf(-9.7, 7, Math.PI/2);
const boxMat = new THREE.MeshStandardMaterial({ color: 0x3a2e20, roughness: 0.85 });
mesh(new THREE.BoxGeometry(1.0,1.0,1.0), boxMat, -7,  0.5, 10);
mesh(new THREE.BoxGeometry(1.2,0.7,0.9), boxMat, -7,  1.2, 10);
mesh(new THREE.BoxGeometry(0.8,1.1,0.8), boxMat, -8,  0.55,9.2);

// ── Character ────────────────────────────────────────────────
const charGroup = new THREE.Group();
scene.add(charGroup);
charGroup.position.set(0,0,-8); // start in room 1

const skinMat  = new THREE.MeshStandardMaterial({ color: 0xf5c89a, roughness: 0.8 });
const shirtMat = new THREE.MeshStandardMaterial({ color: 0xe8874a, roughness: 0.7 });
const pantsMat = new THREE.MeshStandardMaterial({ color: 0x3a3a6a, roughness: 0.8 });
const shoesMat = new THREE.MeshStandardMaterial({ color: 0x1a1008, roughness: 0.9 });
const hairMat  = new THREE.MeshStandardMaterial({ color: 0x3a2010, roughness: 1.0 });

function charMesh(geo, mat, x,y,z) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z); m.castShadow=true; charGroup.add(m); return m;
}

const charBody = charMesh(new THREE.BoxGeometry(0.7,0.9,0.4),  shirtMat, 0,1.35,0);
const charHead = charMesh(new THREE.BoxGeometry(0.5,0.5,0.5),  skinMat,  0,2.05,0);
               charMesh(new THREE.BoxGeometry(0.52,0.2,0.52),  hairMat,  0,2.35,0);
const legL     = charMesh(new THREE.BoxGeometry(0.28,0.72,0.3),pantsMat,-0.18,0.66,0);
const legR     = charMesh(new THREE.BoxGeometry(0.28,0.72,0.3),pantsMat, 0.18,0.66,0);
               charMesh(new THREE.BoxGeometry(0.3,0.14,0.44),  shoesMat,-0.18,0.21,0.07);
               charMesh(new THREE.BoxGeometry(0.3,0.14,0.44),  shoesMat, 0.18,0.21,0.07);

// ── Items ────────────────────────────────────────────────────
const CODE = ['4','2','7'];
const FULL_CODE = '427';
const collectedNums = [];

function makeNote(x, z) {
  const g = new THREE.Group();
  const paper = new THREE.Mesh(
    new THREE.BoxGeometry(0.32, 0.42, 0.025),
    new THREE.MeshStandardMaterial({ color: 0xf0e0a0, roughness: 0.9, emissive: 0xc9a84c, emissiveIntensity: 0.15 })
  );
  paper.castShadow = true; g.add(paper);
  const glow = new THREE.PointLight(0xc9a84c, 1.2, 3.5);
  g.add(glow);
  g.position.set(x, 0.85, z);
  scene.add(g);
  return g;
}

function makeBriefcase(x, z) {
  const g = new THREE.Group();
  const leather = new THREE.MeshStandardMaterial({ color: 0x2e1a08, roughness: 0.92, metalness: 0.0 });
  const lidLeather = new THREE.MeshStandardMaterial({ color: 0x38200a, roughness: 0.9, metalness: 0.0 });
  const metal  = new THREE.MeshStandardMaterial({ color: 0xb8a060, metalness: 0.85, roughness: 0.2 });
  const dark   = new THREE.MeshStandardMaterial({ color: 0x1a1008, roughness: 0.9 });

  // Body
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.72, 0.42), leather);
  body.castShadow=true; body.receiveShadow=true; g.add(body);

  // Lid (pivots at top of body)
  const lidPivot = new THREE.Group();
  lidPivot.position.set(0, 0.36, 0);
  const lid = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.3, 0.42), lidLeather);
  lid.position.y = 0.15;
  lid.castShadow=true; lidPivot.add(lid);
  g.add(lidPivot);
  g._lidPivot = lidPivot;

  // Metal frame edges (horizontal)
  const hEdge = new THREE.BoxGeometry(1.46, 0.045, 0.045);
  for (const [ey, ez] of [[0.36,0.22],[0.36,-0.22],[-0.36,0.22],[-0.36,-0.22]]) {
    const e = new THREE.Mesh(hEdge, metal); e.position.set(0,ey,ez); g.add(e);
  }
  // Vertical corner edges
  const vEdge = new THREE.BoxGeometry(0.045, 0.76, 0.045);
  for (const [ex,ez] of [[0.72,0.22],[0.72,-0.22],[-0.72,0.22],[-0.72,-0.22]]) {
    const e = new THREE.Mesh(vEdge, metal); e.position.set(ex,0,ez); g.add(e);
  }
  // Side edge strips (vertical, depth)
  const dEdge = new THREE.BoxGeometry(0.045, 0.76, 0.44);
  for (const ex of [0.72, -0.72]) {
    const e = new THREE.Mesh(dEdge, metal); e.position.set(ex,0,0); g.add(e);
  }

  // Handle arc
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.17,0.03,8,18,Math.PI), metal);
  handle.position.set(0, 0.72, 0); handle.rotation.z=Math.PI; g.add(handle);
  // Handle mounts
  for (const hx of [-0.17, 0.17]) {
    const mount = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.14,0.06), metal);
    mount.position.set(hx, 0.57, 0); g.add(mount);
  }

  // Two latches
  for (const lx of [-0.35, 0.35]) {
    const latchBody = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.09,0.055), metal);
    latchBody.position.set(lx, 0.33, 0.24); g.add(latchBody);
    const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.04,8), metal);
    btn.rotation.x=Math.PI/2; btn.position.set(lx, 0.31, 0.265); g.add(btn);
  }

  // Center lock
  const lockBody = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.14,0.06), metal);
  lockBody.position.set(0, 0.33, 0.24); g.add(lockBody);
  const keyhole = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.07,8), dark);
  keyhole.rotation.x=Math.PI/2; keyhole.position.set(0, 0.34, 0.275); g.add(keyhole);

  // Stitching lines along top/bottom edges (thin dark strips)
  for (const [sy, sz] of [[0.34,0.18],[0.34,-0.18],[-0.34,0.18],[-0.34,-0.18]]) {
    const stitch = new THREE.Mesh(new THREE.BoxGeometry(1.36,0.012,0.012), dark);
    stitch.position.set(0,sy,sz); g.add(stitch);
  }

  // Glow so it's visible
  const glow = new THREE.PointLight(0xffcc66, 0.7, 5);
  glow.position.set(0,1.2,0); g.add(glow);

  g.position.set(x, 0.44, z);
  scene.add(g);
  return g;
}

const itemsData = [
  { id:'num0', mesh:makeNote(-6, -10),  label:`Du findest einen Zettel.\nDarauf steht: "${CODE[0]}"`,   isNote:true, collected:false },
  { id:'num1', mesh:makeNote( 7,  -6),  label:`Eine alte Serviette.\nDarauf gekritzelt: "${CODE[1]}"`,  isNote:true, collected:false },
  { id:'num2', mesh:makeNote(-4,  -2),  label:`Kreide auf dem Boden.\nEin Kinderkritzel: "${CODE[2]}"`, isNote:true, collected:false },

];

// ── Collision ─────────────────────────────────────────────────
const BOXES = [
  // Furniture
  {x:-6, z:-8,  hw:1.8, hd:0.8},  // desk room1
  {x: 5, z: 7,  hw:1.8, hd:0.8},  // desk room2
  {x:-9.8,z:-6, hw:0.4, hd:0.8},  // shelf room1 left
  {x: 9.8,z:-5, hw:0.4, hd:0.8},  // shelf room1 right
  {x:-9.8,z: 7, hw:0.4, hd:0.8},  // shelf room2
  {x:-7.5,z: 9.8,hw:1.2,hd:1.2},  // boxes room2
  // Outer walls
  {x: 0, z:-12.2, hw:11, hd:0.5},
  {x: 0, z: 12.2, hw:11, hd:0.5},
  {x:-10.2,z:0,   hw:0.5,hd:13},
  {x: 10.2,z:0,   hw:0.5,hd:13},
  // Middle wall segments (with door gap x[-2,2])
  {x:-6,  z:0,    hw:4.2,hd:0.4},
  {x: 6,  z:0,    hw:4.2,hd:0.4},
];
function blocked(x,z) {
  const r=0.45;
  return BOXES.some(b => Math.abs(x-b.x)<b.hw+r && Math.abs(z-b.z)<b.hd+r);
}

// ── Input ─────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => { keys[e.code]=true; onKey(e); });
document.addEventListener('keyup',   e => { keys[e.code]=false; });

// ── UI state ──────────────────────────────────────────────────
let mode = 'play'; // play | message | code | open
let codeInput = '';

const numsEl      = document.getElementById('nums');
const interactEl  = document.getElementById('interact-hint');
const hintTextEl  = document.getElementById('hint-text');
const dialogEl    = document.getElementById('dialog');
const dTitleEl    = document.getElementById('d-title');
const dTextEl     = document.getElementById('d-text');
const codeDispEl  = document.getElementById('code-display');
const codeErrEl   = document.getElementById('code-err');
const dSubEl      = document.getElementById('d-sub');
const revealEl    = document.getElementById('reveal');

function updateNumsHUD() {
  const s = ['_','_','_'];
  collectedNums.forEach((id,i) => { s[i]=CODE[parseInt(id.replace('num',''))]; });
  numsEl.textContent = s.join(' ');
}

function showMsg(title, text) {
  mode='message';
  dTitleEl.textContent=title;
  dTextEl.textContent=text;
  codeDispEl.style.display='none';
  codeErrEl.textContent='';
  dSubEl.textContent='[ ENTER ]  WEITER';
  dialogEl.classList.add('show');
}

function showCode() {
  mode='code'; codeInput='';
  dTitleEl.textContent='ZAHLENSCHLOSS';
  dTextEl.textContent='Gib den 3-stelligen Code ein:';
  codeDispEl.style.display='block';
  codeDispEl.textContent='_ _ _';
  codeErrEl.textContent='';
  dSubEl.textContent='Zahlen tippen  ·  ENTER bestätigen  ·  ESC abbrechen';
  dialogEl.classList.add('show');
}

function closeDialog() { mode='play'; dialogEl.classList.remove('show'); }

function updateCodeDisp() {
  codeDispEl.textContent = (codeInput.padEnd(3,'_')).split('').join(' ');
}

function interact() {
  const near = getNear();
  if (!near) return;
  if (near.isCase) {
    if (collectedNums.length<3) showMsg('AKTENKOFFER','Der Koffer hat ein Zahlenschloss.\nDu brauchst noch den Code...');
    else showCode();
  } else {
    near.collected=true;
    scene.remove(near.mesh);
    collectedNums.push(near.id);
    updateNumsHUD();
    showMsg('GEFUNDEN!', near.label);
  }
}

function openCase() {
  closeDialog();
  mode='open';
  const caseItem = itemsData.find(i=>i.isCase);
  if (caseItem?.mesh?._lidPivot) {
    const pivot = caseItem.mesh._lidPivot;
    let t=0;
    const iv=setInterval(()=>{
      t=Math.min(t+0.025,1);
      pivot.rotation.x = -t * Math.PI * 0.82;
      if(t>=1) clearInterval(iv);
    },16);
  }
  setTimeout(()=>{
    drawTree();
    revealEl.classList.add('show');
  }, 700);
}

function getNear() {
  for (const item of itemsData) {
    if (item.collected && !item.isCase) continue;
    if (charGroup.position.distanceTo(item.mesh.position) < 2.6) return item;
  }
  return null;
}

function onKey(e) {
  if (mode==='message') {
    if (['Enter','Space','KeyE'].includes(e.code)) closeDialog();
    return;
  }
  if (mode==='code') {
    if (e.key>='0' && e.key<='9' && codeInput.length<3) { codeInput+=e.key; updateCodeDisp(); }
    else if (e.code==='Backspace') { codeInput=codeInput.slice(0,-1); updateCodeDisp(); codeErrEl.textContent=''; }
    else if (e.code==='Enter') {
      if (codeInput===FULL_CODE) openCase();
      else { codeErrEl.textContent='Falscher Code. Versuch es nochmal.'; codeInput=''; updateCodeDisp(); }
    }
    else if (e.code==='Escape') closeDialog();
    return;
  }
  if (mode==='open') {
    if (['Enter','Space','Escape'].includes(e.code)) { mode='play'; revealEl.classList.remove('show'); }
    return;
  }
  if (e.code==='KeyE' || e.code==='Enter') interact();
}

// ── Christmas tree canvas ─────────────────────────────────────
function drawTree() {
  const tc=document.getElementById('tree-canvas');
  const tctx=tc.getContext('2d');
  const tw=tc.width, th=tc.height;

  // Old photo background
  const bg=tctx.createLinearGradient(0,0,tw,th);
  bg.addColorStop(0,'#f2e4b8'); bg.addColorStop(1,'#e5d098');
  tctx.fillStyle=bg; tctx.fillRect(0,0,tw,th);

  // Vignette
  const vig=tctx.createRadialGradient(tw/2,th/2,th*0.18,tw/2,th/2,th*0.72);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(80,50,10,0.45)');
  tctx.fillStyle=vig; tctx.fillRect(0,0,tw,th);

  const cx=tw/2, cy=th/2+15;

  // Tree layers
  const layers=[{y:48,w:100},{y:22,w:78},{y:-4,w:58},{y:-26,w:40},{y:-46,w:24}];
  for (const l of layers) {
    tctx.beginPath();
    tctx.moveTo(cx,cy+l.y-38);
    tctx.lineTo(cx-l.w,cy+l.y);
    tctx.lineTo(cx+l.w,cy+l.y);
    tctx.closePath();
    tctx.fillStyle='#2a6535'; tctx.fill();
    tctx.strokeStyle='#1a4525'; tctx.lineWidth=1; tctx.stroke();
  }

  // Trunk
  tctx.fillStyle='#6b3a1a';
  tctx.fillRect(cx-11,cy+50,22,25);

  // Baubles
  const bcols=['#cc2222','#c9a84c','#2244cc','#cc44aa','#22aa44','#ffffff'];
  const decos=[{x:-28,y:8},{x:22,y:4},{x:-12,y:24},{x:32,y:26},{x:-45,y:30},
               {x:8,y:-4},{x:-20,y:-16},{x:24,y:-20},{x:-6,y:-34},{x:48,y:44},{x:-55,y:44}];
  decos.forEach((d,i)=>{
    const col=bcols[i%bcols.length];
    tctx.beginPath(); tctx.arc(cx+d.x,cy+d.y,5,0,Math.PI*2);
    tctx.fillStyle=col; tctx.fill();
    tctx.strokeStyle='rgba(255,255,255,0.4)'; tctx.lineWidth=1; tctx.stroke();
  });

  // Star
  tctx.fillStyle='#f0c030';
  drawStar2d(tctx,cx,cy-83,13,5);

  // Garland lines (simple arcs)
  tctx.strokeStyle='rgba(180,120,20,0.4)'; tctx.lineWidth=1.5;
  for (const l of layers.slice(0,4)) {
    tctx.beginPath();
    tctx.ellipse(cx,cy+l.y-10,l.w*0.7,8,0,0,Math.PI);
    tctx.stroke();
  }

  // Snow on branches
  tctx.fillStyle='rgba(255,255,255,0.55)';
  for (const l of layers) {
    tctx.beginPath();
    tctx.ellipse(cx,cy+l.y-40,l.w*0.35,5,0,0,Math.PI*2);
    tctx.fill();
  }

  // Photo grain
  tctx.fillStyle='rgba(130,100,40,0.05)';
  for(let i=0;i<1200;i++) tctx.fillRect(Math.random()*tw,Math.random()*th,1,1);
}

function drawStar2d(ctx,cx,cy,r,pts) {
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const a=(i*Math.PI/pts)-Math.PI/2;
    const rd=i%2===0?r:r*0.4;
    const x=cx+Math.cos(a)*rd, y=cy+Math.sin(a)*rd;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.fill();
}

// ── Game loop ─────────────────────────────────────────────────
const clock = new THREE.Clock();
const camSmooth  = new THREE.Vector3();
const lookSmooth = new THREE.Vector3();
const camRay     = new THREE.Raycaster();
const SPEED     = 6;
const ROT_SPEED = 2.8; // radians per second

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // Movement
  if (mode==='play') {
    let moving = false;

    // A / D → smooth rotation
    if (keys['ArrowLeft']  || keys['KeyA']) charGroup.rotation.y += ROT_SPEED * dt;
    if (keys['ArrowRight'] || keys['KeyD']) charGroup.rotation.y -= ROT_SPEED * dt;

    // W / S → forward / backward along facing direction
    let fwd = 0;
    if (keys['ArrowUp']   || keys['KeyW']) fwd =  1;
    if (keys['ArrowDown'] || keys['KeyS']) fwd = -1;

    if (fwd !== 0) {
      moving = true;
      const dx = Math.sin(charGroup.rotation.y) * SPEED * fwd * dt;
      const dz = Math.cos(charGroup.rotation.y) * SPEED * fwd * dt;
      const nx = charGroup.position.x + dx;
      const nz = charGroup.position.z + dz;
      if (!blocked(nx, charGroup.position.z)) charGroup.position.x = nx;
      if (!blocked(charGroup.position.x, nz)) charGroup.position.z = nz;
    }

    // Walk animation
    if (moving) {
      const t = Date.now() / 140;
      legL.rotation.x =  Math.sin(t) * 0.55;
      legR.rotation.x = -Math.sin(t) * 0.55;
      charBody.rotation.z = Math.sin(t * 2) * 0.02;
    } else {
      legL.rotation.x *= 0.8;
      legR.rotation.x *= 0.8;
    }
  }

  // Candle flicker
  const flicker = Date.now() / 1000;
  for (const c of candleLights) {
    const noise = Math.sin(flicker * 7.3 + c.light.id) * 0.15
                + Math.sin(flicker * 13.1 + c.light.id * 2) * 0.08;
    c.light.intensity = 1.8 + noise;
    c.flame.scale.setScalar(1 + noise * 0.4);
  }

  // Float items
  const now=Date.now()/1000;
  for (const item of itemsData) {
    if (item.collected && !item.isCase) continue;
    if (item.isNote) {
      item.mesh.position.y=0.85+Math.sin(now*1.4+item.mesh.position.x)*0.12;
      item.mesh.rotation.y+=0.018;
    }
  }

  // Third-person camera with wall collision
  const CAM_DIST = 5.5;
  const charHead = charGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
  const rayDir = new THREE.Vector3(
    -Math.sin(charGroup.rotation.y),
    0.55,   // slight upward angle
    -Math.cos(charGroup.rotation.y)
  ).normalize();
  const idealCamPos = charHead.clone().add(rayDir.clone().multiplyScalar(CAM_DIST));

  // Raycast from character head toward ideal camera position to detect walls
  camRay.set(charHead, rayDir);
  const wallHits = camRay.intersectObjects(wallMeshes);
  let targetCamPos;
  if (wallHits.length > 0 && wallHits[0].distance < CAM_DIST) {
    const safeDist = Math.max(0.5, wallHits[0].distance - 0.5);
    targetCamPos = charHead.clone().add(rayDir.clone().multiplyScalar(safeDist));
  } else {
    targetCamPos = idealCamPos;
  }

  // Lerp toward target, then hard-clamp — camera can never be inside an outer wall
  camSmooth.lerp(targetCamPos, 0.15);
  camSmooth.x = Math.max(-9.4, Math.min(9.4,  camSmooth.x));
  camSmooth.z = Math.max(-11.5,Math.min(11.5, camSmooth.z));
  camSmooth.y = Math.max(1.0,  Math.min(3.7,  camSmooth.y));
  camera.position.copy(camSmooth);

  const lookAt = charGroup.position.clone().add(new THREE.Vector3(0, 1.2, 0));
  lookSmooth.lerp(lookAt, 0.1);
  camera.lookAt(lookSmooth);

  // Interact hint
  const near = mode==='play' ? getNear() : null;
  if (near) {
    interactEl.style.display='block';
    hintTextEl.textContent=near.isCase?'Koffer untersuchen':'Aufheben';
  } else {
    interactEl.style.display='none';
  }

  renderer.render(scene,camera);
}

animate();
</script>
